name: Release PR

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release PR
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Prepare release branch and PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          app_slug="${{ steps.app-token.outputs.app-slug }}"
          app_user_id="$(gh api "/users/${app_slug}[bot]" --jq .id)"
          git config user.name "${app_slug}[bot]"
          git config user.email "${app_user_id}+${app_slug}[bot]@users.noreply.github.com"
          gh auth setup-git
          gh label create release --color 0e8a16 --description "Release preparation PR" || true
          git checkout -B automation/release origin/main
          python3 .github/scripts/release_automation.py prepare-release --body-file build/release-pr-body.md
          release_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "${release_version}" == *-SNAPSHOT ]]; then
            echo "Main is still on a snapshot version; no release PR changes were prepared."
            exit 0
          fi
          if git diff --quiet -- gradle.properties CHANGELOG.md; then
            echo "Release PR is already up to date."
            exit 0
          fi
          git add gradle.properties CHANGELOG.md
          git commit -m "chore(release): prepare ${release_version}"
          git push --force-with-lease origin automation/release
          pr_number="$(gh pr list --head automation/release --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "chore(release): prepare ${release_version}" \
              --body-file build/release-pr-body.md \
              --add-label release
          else
            gh pr create \
              --base main \
              --head automation/release \
              --title "chore(release): prepare ${release_version}" \
              --body-file build/release-pr-body.md \
              --label release
          fi
