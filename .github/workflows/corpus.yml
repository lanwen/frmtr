name: Corpus

# Release-PR corpus correctness check.
#
# Fetches a pinned real-world Java corpus into a throwaway checkout and runs the
# frmtr CLI over its main sources to assert two DISTINCT invariants before
# publishing a release:
#   1. parse-stability + AST-equivalence -- `frmtr --write --verify` re-parses
#      each formatted file and refuses output that is not AST-equivalent to the
#      input. The CLI's distinct exit codes let this step report a formatter bug
#      (exit 3, non-AST-equivalent output) apart from a parse/IO failure (exit 2).
#   2. one-pass idempotence -- after formatting, `frmtr --check` exits 1 if any
#      already-formatted file would still change on a second pass.
#
# These are separate properties: --verify gives parse-stability + AST-equivalence
# only; it does NOT prove one-pass idempotence, which is why step 2 exists. The
# mutating --write --verify then read-only --check pairing is deliberate. (The
# read-only `--check --verify` mode is for non-throwaway targets; this checkout
# is ephemeral, so mutating it in place is fine and idempotence still needs the
# separate --check pass.)
#
# All knobs (corpus pin, scope, excludes) live in the `env` block below so they
# are trivial to bump. No bespoke Java harness -- this reuses the shipping CLI.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - main

permissions:
  # Allows checkout to read the release PR sources.
  contents: read

env:
  # --- Corpus pin (bump these two to move/upgrade the corpus) ---
  CORPUS_REPO: https://github.com/testcontainers/testcontainers-java.git
  CORPUS_SHA: deb78e1e6e47675f56e8d7b3f4747093d66f1baa
  # --- Scope: which corpus directories to format (shell-expanded into CLI args).
  #     core main sources + every module's main sources. ---
  CORPUS_SCOPE: "core/src/main/java modules/*/src/main/java"
  # --- Excludes: never format build output, generated code, or test sources. ---
  CORPUS_EXCLUDES: "--exclude **/build/** --exclude **/generated/** --exclude **/src/test/**"
  CORPUS_DIR: corpus

jobs:
  check:
    name: Corpus correctness (CLI --write --verify + --check)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build CLI dist
        run: ./gradlew :frmtr-cli:installDist

      - name: Cache corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_DIR }}
          key: corpus-${{ env.CORPUS_SHA }}

      - name: Fetch pinned corpus
        run: |
          set -euo pipefail
          if [ -d "$CORPUS_DIR/.git" ] && \
             [ "$(git -C "$CORPUS_DIR" rev-parse HEAD)" = "$CORPUS_SHA" ]; then
            echo "Corpus cache hit at $CORPUS_SHA"
          else
            rm -rf "$CORPUS_DIR"
            mkdir -p "$CORPUS_DIR"
            git -C "$CORPUS_DIR" init -q
            git -C "$CORPUS_DIR" remote add origin "$CORPUS_REPO"
            git -C "$CORPUS_DIR" fetch --depth 1 origin "$CORPUS_SHA"
            git -C "$CORPUS_DIR" checkout -q FETCH_HEAD
          fi

      - name: Parse-stability + AST-equivalence (frmtr --write --verify)
        working-directory: ${{ env.CORPUS_DIR }}
        run: |
          set -uo pipefail
          # --verify re-parses each output and refuses non-AST-equivalent results;
          # --write is required for --verify here. We mutate this throwaway checkout
          # in place. The CLI's distinct exit codes let us message a formatter bug
          # apart from a parse/IO failure:
          #   0  ok                       2  parse/IO failure
          #   3  FORMATTER BUG (non-AST-equivalent output)
          "$GITHUB_WORKSPACE"/frmtr-cli/build/install/frmtr-cli/bin/frmtr-cli \
            --write --verify --progress=never \
            $CORPUS_EXCLUDES \
            $CORPUS_SCOPE
          status=$?
          case "$status" in
            0) echo "Parse-stability + AST-equivalence: ok." ;;
            3) echo "::error::FORMATTER BUG: non-AST-equivalent output on the corpus (exit 3)."; exit 1 ;;
            2) echo "::error::Parse failure or IO error formatting the corpus (exit 2)."; exit 1 ;;
            *) echo "::error::Unexpected frmtr exit code $status."; exit 1 ;;
          esac

      - name: One-pass idempotence (frmtr --check)
        working-directory: ${{ env.CORPUS_DIR }}
        run: |
          set -uo pipefail
          # The corpus is now formatted; --check exits 1 if any file would still
          # change, i.e. formatting is not a fixed point. This checks one-pass
          # idempotence, which --verify does NOT cover. (--check and --write cannot
          # be combined, so this is a second invocation over the mutated tree.)
          "$GITHUB_WORKSPACE"/frmtr-cli/build/install/frmtr-cli/bin/frmtr-cli \
            --check --diff --progress=never \
            $CORPUS_EXCLUDES \
            $CORPUS_SCOPE
          status=$?
          case "$status" in
            0) echo "One-pass idempotence: ok." ;;
            1) echo "::error::Non-idempotent: a formatted file would still change (exit 1)."; exit 1 ;;
            *) echo "::error::Unexpected frmtr exit code $status during idempotence check."; exit 1 ;;
          esac
