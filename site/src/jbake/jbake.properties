site.host=https://lanwen.github.io/frmtr
# Local dev server (./gradlew :site:serve). Keep in sync with .claude/launch.json's port.
server.port=8820
server.hostname=localhost
server.contextPath=/
render.index=false
render.archive=false
render.feed=false
render.tags=false
render.sitemap=false
template.landing.file=index.ftl
template.encoding=UTF-8
output.extension=.html
default.status=published
# Shown in the top-right of the site nav. Release automation updates this to the
# final release version when preparing a release PR.
# Accessed in templates as ${config.frmtr_version} (JBake maps dots to underscores).
frmtr.version=0.3.0
frmtr.repo=https://github.com/lanwen/frmtr
