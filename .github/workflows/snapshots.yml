name: Snapshots

on:
  push:
    branches:
      - main
    paths:
      - "**/*.gradle.kts"
      - "**/*.java"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Maven Central snapshots
    runs-on: ubuntu-latest
    environment: snapshots
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Read project version
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Publish snapshots
        if: ${{ endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
        run: ./gradlew check publishAllPublicationsToCentralPortalSnapshotsRepository
