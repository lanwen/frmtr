name: Snapshots

on:
  push:
    branches:
      - main
    paths:
      - "**/*.gradle.kts"
      - "**/*.java"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish Maven Central snapshots
    runs-on: ubuntu-latest
    environment: snapshots
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Read project version
        id: version
        run: echo "version=$(grep '^version=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Publish snapshots
        if: ${{ endsWith(steps.version.outputs.version, '-SNAPSHOT') }}
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
        run: ./gradlew check publishAllPublicationsToCentralPortalSnapshotsRepository
